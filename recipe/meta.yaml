{% set name = "yaxt" %}
{% set version = "0.12.1" %}
{% set build = 0 %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/pism/{{ name }}-mirror/archive/v{{ version }}.tar.gz
  sha256: 78dc6c16ee9b3eced5c81fac24e83940bf98172d6927cba189366050d7652228

build:
  skip: true  # [win]
  number: {{ build }}

  # add build string so packages can depend on mpi/idxtype variants explicitly:
  # `yaxt * mpi_mpich_*` for mpich
  # `yaxt * mpi_openmpi_*` for openmpi
  # `yaxt * mpi_*` for any mpi
  # `yaxt * *_idxtype_long_*` for the 64-bit Xt_int build (see idxtype below)

  {% set mpi = mpi or "mpich" %}
  {% set mpi_prefix = "mpi_" + mpi %}
  # yaxt's Xt_int index type defaults to a 32-bit int unless configured with
  # --with-idxtype=long (64-bit). Some consumers (e.g. LFRic, whose halo-index
  # type is 64-bit) need the 64-bit build; changing the *default* build's ABI
  # would break existing consumers pinned to today's (32-bit) `yaxt`, so this
  # is a second, additive, opt-in variant instead -- same pattern as `mpi`.
  {% set idxtype = idxtype or "int" %}
  {% set idxtype_suffix = "" if idxtype == "int" else "_idxtype_" + idxtype %}
  string: {{ mpi_prefix }}{{ idxtype_suffix }}_h{{ PKG_HASH }}_{{ build }}
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}
    - {{ name }} * {{ mpi_prefix }}{{ idxtype_suffix }}_*

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - {{ stdlib('c') }}
    - autoconf
    - automake
    - libtool
    - make
    - pkg-config
    # openmpi's mpicc/mpifort wrappers are compiled binaries for the target
    # arch; when cross-compiling (e.g. osx-64 -> osx-arm64) they can't run on
    # the build machine, so we need a build-arch copy of openmpi too (mpich's
    # wrappers are portable shell scripts and don't need this). Same pattern
    # as conda-forge/libpnetcdf-feedstock.
    - {{ mpi }}  # [mpi == "openmpi" and build_platform != target_platform]
    # conda-forge/ctng-compilers-feedstock#225: ctng-compiler-activation
    # dropped the `gcc_<target>` pin from `gfortran_<target>` on osx, and
    # `gfortran_impl_osx-*` 15.3.0 only asks for `gcc_impl_osx-* >=15.3.0`.
    # The solver therefore pairs gfortran 15.3.0 with gcc_impl 16.1.0, which
    # installs the C-side GCC bits (crt*.o, libgcc.a, libemutls_w.a, ...)
    # under lib/gcc/<triplet>/16.1.0/ while gfortran 15.3.0 only looks in
    # .../15.3.0/ -- so *every* Fortran link fails and configure aborts with
    # "unable to link a Fortran program using libtool". Pin the C-side GCC to
    # the Fortran compiler's own version until upstream restores the pin.
    - gcc_impl_osx-64 {{ fortran_compiler_version }}.*     # [osx]
    - gcc_impl_osx-arm64 {{ fortran_compiler_version }}.*  # [osx and target_platform == "osx-arm64"]
  host:
    - llvm-openmp  # [osx]
    - libgomp      # [linux]
    - {{ mpi }}
  run:
    - {{ mpi }}

test:
  requires:
    - {{ compiler('c') }}
  files:
    - test_idxtype.c
  commands:
    - test -f ${PREFIX}/lib/libyaxt.so  # [linux]
    - test -f ${PREFIX}/lib/libyaxt.dylib  # [osx]
    - test -f ${PREFIX}/lib/libyaxt_c.so  # [linux]
    - test -f ${PREFIX}/lib/libyaxt_c.dylib  # [osx]
    - test -f ${PREFIX}/include/yaxt.h
    - test -f ${PREFIX}/include/yaxt.mod
    # autoconf silently ignores an unknown --with-idxtype, so verify the
    # installed Xt_int actually has the width this build's string promises.
    # Skipped when cross-compiling (osx_arm64, built from osx_64): the
    # compiled test binary targets the host arch, not the build machine's,
    # so it can't be executed here.
    - ${PREFIX}/bin/mpicc -I${PREFIX}/include -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -DXT_EXPECTED_TYPE={{ idxtype }} test_idxtype.c -o test_idxtype -lyaxt  # [build_platform == target_platform]
    - ./test_idxtype  # [build_platform == target_platform]

about:
  home: https://gitlab.dkrz.de/dkrz-sw/yaxt
  summary: Yet Another eXchange Tool (yaxt) for coupling of Earth system model components.
  description: |
    Yet Another eXchange Tool (yaxt) is a lightweight software library for coupling of Earth system model components
    which provides automated data redistributions in distributed memory applications.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://dkrz-sw.gitlab-pages.dkrz.de/yaxt/index.html
  dev_url: https://gitlab.dkrz.de/dkrz-sw/yaxt

extra:
  recipe-maintainers:
    - jhkennedy
    - ckhroulev
    - aaschwanden
    - larsbuntemeyer
    - ickc
